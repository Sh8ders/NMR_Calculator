[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmr-calculator"
version = "0.2.0"
description = "Phase 2 scaffold for a future 1H NMR proton chemical shift and spectrum prediction tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "numpy",
    "pandas",
    "matplotlib",
    "rdkit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
nmr-calculator = "nmr_calculator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
